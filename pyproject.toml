[project]
name = "quant-trading"
version = "0.1.0"
description = "个人加密货币量化交易平台：OKX 数据源 + TradingView Pine 回测 + webhook 下单"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "daxiongmao" }]
dependencies = []

# M1 阶段依赖（最小集，按 spec §13 实现顺序逐步补全）
[project.optional-dependencies]
m1 = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "tomli>=2.0; python_version<'3.11'",
]
m2 = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "fakeredis>=2.21",
    "httpx>=0.27",
]

[project.scripts]
quant = "quant.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
